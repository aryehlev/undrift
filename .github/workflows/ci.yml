name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o undrift ./cmd/undrift && ./undrift version
      - name: Build and test without cgo (no symbol analysis)
        run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go test ./...
