# Include from .gitlab-ci.yml:  include: { local: undrift.gitlab-ci.yml }
# and schedule it under CI/CD → Schedules.
#
# Required CI/CD variables (masked):
#   GITLAB_TOKEN  a project or bot token with `api` and `write_repository`
#                 scopes, used to push synchronization branches and open
#                 merge requests (CI_JOB_TOKEN cannot create MRs)
#   plus your agent's API key (e.g. ANTHROPIC_API_KEY or OPENAI_API_KEY).
# The job image must also provide the agent CLI ({{agent}}).
undrift:
  image: golang:1.22
  resource_group: undrift
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "0"
  script:
    - go install github.com/aryehlev/undrift/cmd/undrift@latest
    - git config user.name undrift && git config user.email undrift@localhost
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - undrift state pull
    - undrift run --agent {{agent}} || { c=$?; [ "$c" -eq 3 ] || [ "$c" -eq 6 ]; }   # 3 = nothing to do, 6 = needs review
    - undrift state push
  after_script:
    - undrift report --output undrift-report.md || true
  artifacts:
    when: always
    paths: [undrift-report.md]
